services:
  # FastAPI API Backend
  - type: web
    name: selene-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: selene-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: selene-redis
          property: connectionString

  # Background Worker
  - type: worker
    name: selene-worker
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m runtime.workers.worker_pool
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: selene-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: selene-redis
          property: connectionString

# Databases and Redis
databases:
  - name: selene-db
    databaseName: selene_db
    user: selene

redis:
  - name: selene-redis
    ipAllowList: [] # only allow internal connections
